server.port=8080
spring.datasource.url=jdbc:postgresql://db:5432/clickerdb
spring.datasource.username=${POSTGRES_USER:clicker}
spring.datasource.password=${POSTGRES_PASSWORD:clicker}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:please-change-in-prod}
jwt.expiration=86400000
